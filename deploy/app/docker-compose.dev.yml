# Dev-контейнер. Не использует образ booking-web:latest и порт 8080 продакшена.
name: booking-web-dev

services:
  booking-web:
    build:
      context: ../..
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-pocketbase}
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-https://pb.booking.vallome.ru}
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-9158776426}
    image: booking-web:dev
    container_name: booking-web-dev
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8081:8080"
    # Не боевой /opt/pocketbase/booking-web.env: там ключи ЮKassa прода.
    # Файл dev создаётся на мини-ПК и в git не входит. Пока в нём нет
    # тестового магазина, YOOKASSA_LIVE_PAYMENTS=off не пускает боевой платёж.
    environment:
      YOOKASSA_LIVE_PAYMENTS: "off"
    env_file:
      - path: /opt/pocketbase/booking-web.dev.env
        required: false
    volumes:
      # Отдельный каталог фото. Не /opt/booking-web/data.
      # CI задаёт BOOKING_WEB_DEV_DATA=$HOME/booking-web-dev/data.
      # Без переменной compose не стартует и не пишет в чужой домашний каталог.
      - ${BOOKING_WEB_DEV_DATA:?Задайте BOOKING_WEB_DEV_DATA}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
