name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Self-hosted runner на мини-ПК (метка minipc): входящий SSH не нужен.
    # Только main. Push в dev этот job не запускает и продакшен-контейнер не трогает.
    runs-on: [self-hosted, minipc]
    env:
      VITE_DATA_SOURCE: pocketbase
      VITE_POCKETBASE_URL: ${{ vars.VITE_POCKETBASE_URL || 'https://pb.booking.vallome.ru' }}
    steps:
      - uses: actions/checkout@v4

      - name: Сохранить текущий образ для отката
        run: docker tag booking-web:latest booking-web:previous || true

      - name: Сборка и запуск
        working-directory: deploy/app
        run: |
          docker compose build
          docker compose up -d --remove-orphans

      - name: Проверка здоровья
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "Приложение не поднялось, откат" >&2
          if docker image inspect booking-web:previous >/dev/null 2>&1; then
            docker tag booking-web:previous booking-web:latest
            cd deploy/app && docker compose up -d --no-build
          fi
          exit 1

      - name: Хуки и миграции PocketBase
        run: |
          cp -a deploy/pocketbase/pb_hooks/. /opt/pocketbase/pb_hooks/
          cp -a deploy/pocketbase/pb_migrations/. /opt/pocketbase/pb_migrations/
          docker restart pocketbase
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health; then exit 0; fi
            sleep 2
          done
          echo "PocketBase не поднялся" >&2
          exit 1

      - name: Чистка старых образов
        if: success()
        run: docker image prune -f

  deploy-dev:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    # Только ветка dev: образ booking-web:dev, порт 8081, без перезапуска PocketBase.
    runs-on: [self-hosted, minipc]
    env:
      VITE_DATA_SOURCE: pocketbase
      VITE_POCKETBASE_URL: ${{ vars.VITE_POCKETBASE_URL || 'https://pb.booking.vallome.ru' }}
    steps:
      - uses: actions/checkout@v4

      - name: Каталог данных dev
        run: |
          dir="${HOME}/booking-web-dev/data"
          mkdir -p "$dir"
          echo "BOOKING_WEB_DEV_DATA=$dir" >> "$GITHUB_ENV"

      - name: Сохранить текущий dev-образ для отката
        run: docker tag booking-web:dev booking-web:dev-previous || true

      - name: Сборка и запуск dev
        working-directory: deploy/app
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml up -d

      - name: Проверка здоровья dev
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/healthz; then exit 0; fi
            sleep 2
          done
          echo "Dev-приложение не поднялось, откат" >&2
          if docker image inspect booking-web:dev-previous >/dev/null 2>&1; then
            docker tag booking-web:dev-previous booking-web:dev
            cd deploy/app && docker compose -f docker-compose.dev.yml up -d --no-build
          fi
          exit 1

      - name: Сайт dev в Caddy
        run: bash deploy/minipc/caddy/ensure-dev-site.sh

      - name: Чистка старых образов
        if: success()
        run: docker image prune -f
