$kind: http-example
name: 401 No token
order: 1000
request:
  method: POST
  url: '{{base_url}}/api/payments'
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "amount": 10
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Войдите в аккаунт"
      }
