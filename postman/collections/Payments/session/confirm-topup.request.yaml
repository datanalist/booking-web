$kind: http-request
order: 2000
method: POST
url: '{{base_url}}/api/payments/confirm'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "{{payment_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("свежий платёж ещё не зачислен", function () {
        pm.response.to.have.status(200);
        pm.expect(body.status).to.eql("pending");
        pm.expect(body).to.not.have.property("balance");
      });
